name: Quality gates

on:
  pull_request:
    branches: [development, testing, main]
  push:
    branches: [development, testing, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Compile, lint, scan, and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Java for PySpark
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --no-deps --editable .

      - name: Compile Python
        run: python -m compileall -q src notebooks tests

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint Python
        run: python -m ruff check .

      - name: Parse Databricks SQL quality checks
        run: |
          python - <<'PY'
          from pathlib import Path

          import sqlglot

          paths = sorted(Path("tests/sql").rglob("*.sql"))
          for path in paths:
              sqlglot.parse(path.read_text(), read="databricks")
          print(f"Parsed {len(paths)} Databricks SQL files")
          PY

      - name: Scan source code
        run: python -m bandit -q -r src

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt --strict

      - name: Run full test suite
        env:
          PYSPARK_PYTHON: python
        run: >-
          python -m pytest -q
          --cov=nyc_mobility
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=70
          --junitxml=pytest.xml

      - name: Reject skipped tests
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("pytest.xml").getroot()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in suites)
          if skipped:
              raise SystemExit(f"Quality gate failed: {skipped} test(s) skipped")
          PY
