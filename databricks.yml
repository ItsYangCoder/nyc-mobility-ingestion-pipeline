bundle:
  name: nyc-mobility
  databricks_cli_version: ">= 0.294.0"

sync:
  include:
    - notebooks/**
    - src/**
    - tests/sql/**
    - pyproject.toml
    - requirements.txt
  exclude:
    - "**/__pycache__/**"
    - "**/*.pyc"
    - data/**

variables:
  service_principal_name:
    description: Application ID used as the production run identity.

  catalog:
    description: Unity Catalog catalog used by pipeline-managed tables.
    default: nyc_mobility

  landing_schema:
    default: nyc_group_c
  landing_volume:
    default: nyc_source_files
  bronze_schema:
    default: nyc_bronze
  silver_schema:
    default: nyc_silver
  gold_schema:
    default: nyc_gold
  quality_schema:
    default: nyc_quality

  landing_path:
    description: Shared R2-backed Unity Catalog Volume landing directory.
    default: /Volumes/nyc_mobility/nyc_group_c/nyc_source_files/landing

  timezone:
    default: America/New_York

  analysis_start_date:
    default: "2026-03-01"
  analysis_end_date:
    default: "2026-05-31"

  weather_source_url:
    default: https://archive-api.open-meteo.com/v1/archive
  green_taxi_base_url:
    default: https://d37ci6vzurychx.cloudfront.net/trip-data
  taxi_zones_source_url:
    default: https://d37ci6vzurychx.cloudfront.net/misc/taxi_zone_lookup.csv

resources:
  pipelines:
    medallion_pipeline:
      name: nyc-mobility-medallion
      catalog: ${var.catalog}
      schema: ${var.bronze_schema}
      root_path: ${workspace.file_path}/src
      serverless: true
      continuous: false
      channel: CURRENT
      edition: ADVANCED
      photon: true
      development: false
      allow_duplicate_names: false

      configuration:
        nyc_mobility.catalog: ${var.catalog}
        nyc_mobility.landing_schema: ${var.landing_schema}
        nyc_mobility.landing_volume: ${var.landing_volume}
        nyc_mobility.bronze_schema: ${var.bronze_schema}
        nyc_mobility.silver_schema: ${var.silver_schema}
        nyc_mobility.gold_schema: ${var.gold_schema}
        nyc_mobility.quality_schema: ${var.quality_schema}
        nyc_mobility.landing_path: ${var.landing_path}
        nyc_mobility.timezone: ${var.timezone}
        nyc_mobility.analysis_start_date: ${var.analysis_start_date}
        nyc_mobility.analysis_end_date: ${var.analysis_end_date}
        nyc_mobility.weather_source_url: ${var.weather_source_url}
        nyc_mobility.green_taxi_base_url: ${var.green_taxi_base_url}
        nyc_mobility.taxi_zones_source_url: ${var.taxi_zones_source_url}

      libraries:
        - glob:
            include: ${workspace.file_path}/src/nyc_mobility/transformations/**

      tags:
        application: nyc-mobility
        managed-by: bundle

targets:
  development:
    mode: development
    default: true

    variables:
      catalog: nyc_mobility_dev
      landing_path: /Volumes/nyc_mobility/nyc_group_c/nyc_source_files/landing
      service_principal_name: unused-in-development

    resources:
      pipelines:
        medallion_pipeline:
          development: true

  production:
    mode: production

    variables:
      catalog: nyc_mobility
      landing_path: /Volumes/nyc_mobility/nyc_group_c/nyc_source_files/landing

    run_as:
      service_principal_name: ${var.service_principal_name}

    permissions:
      - level: CAN_MANAGE
        group_name: admins

    resources:
      pipelines:
        medallion_pipeline:
          development: false

      jobs:
        ingest_raw_sources:
          name: nyc-mobility-ingest-raw
          description: >-
            Validate the landing location and acquire source files.
            Run this before refreshing the production pipeline.
          max_concurrent_runs: 1
          timeout_seconds: 9000

          queue:
            enabled: true

          parameters:
            - name: catalog
              default: ${var.catalog}
            - name: landing_schema
              default: ${var.landing_schema}
            - name: landing_volume
              default: ${var.landing_volume}
            - name: landing_path_override
              default: ${var.landing_path}
            - name: bronze_schema
              default: ${var.bronze_schema}
            - name: silver_schema
              default: ${var.silver_schema}
            - name: gold_schema
              default: ${var.gold_schema}
            - name: quality_schema
              default: ${var.quality_schema}
            - name: timezone
              default: ${var.timezone}
            - name: analysis_start_date
              default: ${var.analysis_start_date}
            - name: analysis_end_date
              default: ${var.analysis_end_date}
            - name: weather_source_url
              default: ${var.weather_source_url}
            - name: green_taxi_base_url
              default: ${var.green_taxi_base_url}
            - name: taxi_zones_source_url
              default: ${var.taxi_zones_source_url}

          environments:
            - environment_key: default
              spec:
                environment_version: "4"
                dependencies:
                  - -r ${workspace.file_path}/requirements.txt

          tasks:
            - task_key: setup_environment
              environment_key: default
              timeout_seconds: 900
              max_retries: 1
              min_retry_interval_millis: 60000
              retry_on_timeout: true
              notebook_task:
                notebook_path: ./notebooks/00_setup.py

            - task_key: land_raw_sources
              depends_on:
                - task_key: setup_environment
              environment_key: default
              timeout_seconds: 7200
              max_retries: 3
              min_retry_interval_millis: 120000
              retry_on_timeout: true
              notebook_task:
                notebook_path: ./notebooks/01_land_raw_sources.py

          tags:
            application: nyc-mobility
            managed-by: bundle

        refresh_medallion:
          name: nyc-mobility-refresh-medallion
          description: >-
            Refresh production Bronze, Silver, and Gold using files
            already present in the shared landing Volume.
          max_concurrent_runs: 1
          timeout_seconds: 7200

          queue:
            enabled: true

          tasks:
            - task_key: refresh_medallion_pipeline
              timeout_seconds: 7200
              max_retries: 1
              min_retry_interval_millis: 300000
              retry_on_timeout: true
              pipeline_task:
                pipeline_id: ${resources.pipelines.medallion_pipeline.id}
                full_refresh: false

          tags:
            application: nyc-mobility
            managed-by: bundle
