# Databricks Unity Catalog contract
catalog: nyc_mobility

landing:
  schema: nyc_group_c
  volume: nyc_source_files
  root_path: /Volumes/nyc_mobility/nyc_group_c/nyc_source_files/landing

schemas:
  bronze: nyc_bronze
  silver: nyc_silver
  gold: nyc_gold
  quality: nyc_quality

pipeline:
  name: nyc_group_c_mobility_pipeline
  mode: triggered
  source_root: src/nyc_mobility/transformations
  default_schema: nyc_bronze

tables:
  bronze:
    green_taxi: nyc_mobility.nyc_bronze.bronze_green_taxi_raw
    weather: nyc_mobility.nyc_bronze.bronze_weather_raw
    taxi_zones: nyc_mobility.nyc_bronze.bronze_taxi_zones_raw
  silver:
    green_taxi: nyc_mobility.nyc_silver.silver_green_taxi_trips
    weather: nyc_mobility.nyc_silver.silver_weather_hourly
    taxi_zones: nyc_mobility.nyc_silver.silver_taxi_zones
  gold:
    dim_date: nyc_mobility.nyc_gold.dim_date
    dim_hour: nyc_mobility.nyc_gold.dim_hour
    dim_zone: nyc_mobility.nyc_gold.dim_zone
    fact_taxi_trip: nyc_mobility.nyc_gold.fact_taxi_trip
    fact_weather_hourly: nyc_mobility.nyc_gold.fact_weather_hourly

rules:
  - Use development for active integration work.
  - Promote development to testing and testing to main through reviewed PRs.
  - Do not write pipeline tables to the landing schema.
  - Use fully qualified names for Silver and Gold tables.
  - Use nyc_quality only for quarantine and validation outputs.
