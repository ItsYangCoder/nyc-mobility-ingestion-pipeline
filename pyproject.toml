[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-mobility"
version = "0.1.0"
description = "Reusable ingestion and transformation code for the NYC Mobility pipeline"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
